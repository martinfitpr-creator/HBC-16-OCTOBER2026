<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%">
  <!-- Left: City of Joburg Badge -->
  <g transform="translate(15, 25)">
    <!-- Outline Box with Soft Rounded Corners -->
    <rect x="0" y="0" width="190" height="95" rx="10" ry="10" fill="#FFFFFF" stroke="#888888" stroke-width="1.8" />

    <!-- Stylized Joburg with Beacon -->
    <g transform="translate(20, 25)">
      <!-- Beacon / Tower above 'j' -->
      <line x1="22" y1="-8" x2="22" y2="18" stroke="#1A1A1A" stroke-width="2.5" />
      <polygon points="22,-8 18,12 26,12" fill="#1A1A1A" />
      <circle cx="22" cy="22" r="4.5" fill="#E5A823" />
      
      <!-- "joburg" text -->
      <text x="32" y="32" 
            font-family="'Arial Black', 'Impact', sans-serif" 
            font-size="34" 
            font-weight="bold" 
            fill="#1A1A1A">joburg</text>

      <!-- Tagline -->
      <text x="-4" y="55" 
            font-family="'Arial', sans-serif" 
            font-size="10.5" 
            font-weight="bold" 
            fill="#1A1A1A">a world class African city</text>
    </g>
  </g>

  <!-- Right: JRA Tower and Curved Highway Road -->
  <g transform="translate(240, 15)">
    <!-- Iconic Hillbrow Telecom Tower Landmark -->
    <g transform="translate(42, -5)">
      <line x1="18" y1="0" x2="18" y2="10" stroke="#E53935" stroke-width="2" />
      <!-- Tower Top Pod Sections -->
      <rect x="12" y="10" width="12" height="6" fill="#E53935" />
      <rect x="11" y="16" width="14" height="6" fill="#FB8C00" />
      <rect x="13" y="22" width="10" height="6" fill="#43A047" />
      <rect x="14" y="28" width="8" height="6" fill="#1E88E5" />
      <!-- Tower Mast -->
      <rect x="16" y="34" width="4" height="42" fill="#546E7A" />
    </g>

    <!-- Curved Highway Road with Perspective Striping -->
    <path d="M 12 75 C 45 75 75 88 125 110 L 80 110 C 50 96 35 90 8 90 Z" fill="#1E1E1E" />
    <!-- Dashed Center Line -->
    <path d="M 15 82 C 40 82 60 92 105 110" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 6" fill="none" />

    <!-- "JRA" Bold Letters -->
    <text x="75" y="102" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="#1A1A1A" 
          stroke="#424242" 
          stroke-width="1.2"
          letter-spacing="2">JRA</text>
  </g>

  <!-- Bottom Full Title: "Johannesburg Road Agency" -->
  <g transform="translate(20, 165)">
    <text x="0" y="34" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="34" 
          font-weight="900" 
          fill="#1A1A1A" 
          letter-spacing="-0.5">Johannesburg Road</text>

    <text x="0" y="70" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="34" 
          font-weight="900" 
          fill="#1A1A1A" 
          letter-spacing="-0.5">Agency</text>
  </g>
</svg>
