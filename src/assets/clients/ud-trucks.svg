<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <!-- Outer Chrome Ring Gradient -->
    <linearGradient id="udChromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5A5A5" />
      <stop offset="75%" stop-color="#F5F5F5" />
      <stop offset="100%" stop-color="#707070" />
    </linearGradient>

    <!-- Inner Red Badge Gradient -->
    <radialGradient id="udRedBadge" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="55%" stop-color="#D7141E" />
      <stop offset="85%" stop-color="#B20A13" />
      <stop offset="100%" stop-color="#88050C" />
    </radialGradient>

    <!-- 3D Silver Letter Gradient -->
    <linearGradient id="udSilverLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#C5C5C5" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#9C9C9C" />
      <stop offset="100%" stop-color="#737373" />
    </linearGradient>

    <filter id="udDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Chrome Rim -->
  <circle cx="160" cy="110" r="88" fill="url(#udChromeRing)" filter="url(#udDropShadow)" />
  <circle cx="160" cy="110" r="80" fill="#6A6A6A" />
  <circle cx="160" cy="110" r="78" fill="url(#udChromeRing)" />

  <!-- Inner Red Fill -->
  <circle cx="160" cy="110" r="72" fill="url(#udRedBadge)" />

  <!-- Chrome "UD" Letters -->
  <g transform="translate(160, 110)">
    <!-- Letter U -->
    <path d="M -54 -38 L -36 -38 L -36 12 C -36 28 -28 35 -14 35 C 0 35 8 28 8 12 L 8 -38 L 26 -38 L 26 14 C 26 38 12 50 -14 50 C -40 50 -54 38 -54 14 Z" 
          fill="url(#udSilverLetter)" 
          stroke="#404040" 
          stroke-width="1.2"
          transform="translate(-16, 0) scale(0.85)" />

    <!-- Letter D -->
    <path d="M -16 -38 L 22 -38 C 50 -38 68 -22 68 6 C 68 34 50 50 22 50 L -16 50 Z M 2 34 L 20 34 C 36 34 48 24 48 6 C 48 -12 36 -22 20 -22 L 2 -22 Z" 
          fill="url(#udSilverLetter)" 
          stroke="#404040" 
          stroke-width="1.2"
          transform="translate(8, 0) scale(0.85)" />
  </g>

  <!-- Typography: UD TRUCKS -->
  <text x="160" y="245" 
        text-anchor="middle" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="1" 
        fill="#1A1A1A">UD TRUCKS</text>
</svg>
