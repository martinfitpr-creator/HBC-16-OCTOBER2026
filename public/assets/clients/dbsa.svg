<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <!-- Warm Bronze/Gold Tree Color -->
    <linearGradient id="dbsaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C58E38" />
      <stop offset="100%" stop-color="#8C5C1B" />
    </linearGradient>
  </defs>

  <!-- Sprouting Acacia Tree Branches Motif -->
  <g transform="translate(160, 80) scale(0.95)" fill="none" stroke="url(#dbsaGold)" stroke-linecap="round">
    <!-- Center Branch -->
    <path d="M 0 30 C 0 5 0 -20 0 -45" stroke-width="6" />
    <path d="M 0 -25 C 10 -40 25 -48 40 -50" stroke-width="4.5" />
    <path d="M 0 -25 C -10 -40 -25 -48 -40 -50" stroke-width="4.5" />

    <!-- Left Arching Tree Canopy Curves -->
    <path d="M -5 30 C -15 10 -35 -5 -65 -20" stroke-width="5.5" />
    <path d="M -10 30 C -25 5 -50 -15 -78 -35" stroke-width="5" />
    <path d="M -15 30 C -35 0 -60 -25 -82 -50" stroke-width="4" />

    <!-- Right Arching Tree Canopy Curves -->
    <path d="M 5 30 C 15 10 35 -5 65 -20" stroke-width="5.5" />
    <path d="M 10 30 C 25 5 50 -15 78 -35" stroke-width="5" />
    <path d="M 15 30 C 35 0 60 -25 82 -50" stroke-width="4" />
  </g>

  <!-- Acronym: "DBSA" -->
  <text x="160" y="180" 
        text-anchor="middle" 
        font-family="'Times New Roman', 'Georgia', serif" 
        font-size="64" 
        font-weight="bold" 
        letter-spacing="2" 
        fill="#8C5C1B">DBSA</text>

  <!-- Subtitle: Development Bank of Southern Africa -->
  <text x="160" y="215" 
        text-anchor="middle" 
        font-family="'Arial', 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#8C5C1B" 
        letter-spacing="0.5">Development Bank</text>

  <text x="160" y="238" 
        text-anchor="middle" 
        font-family="'Arial', 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#8C5C1B" 
        letter-spacing="0.5">of Southern Africa</text>
</svg>
