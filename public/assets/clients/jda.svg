<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <!-- Central Group -->
  <g transform="translate(25, 20)">
    <!-- "J D A" Acronym -->
    <text x="0" y="115" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="108" 
          font-weight="bold" 
          fill="#11293B" 
          letter-spacing="4">JDA</text>

    <!-- Skyline Hand Motif on Top Right of JDA -->
    <g transform="translate(245, 10)">
      <!-- 4 Tower Pillars / Fingers -->
      <path d="M 12 60 L 12 12 L 24 6 L 24 60 Z" fill="#8C1D24" />
      <path d="M 32 60 L 32 0 L 44 -6 L 44 60 Z" fill="#8C1D24" />
      <path d="M 52 60 L 52 8 L 64 2 L 64 60 Z" fill="#8C1D24" />
      <path d="M 72 60 L 72 24 L 84 18 L 84 60 Z" fill="#8C1D24" />

      <!-- Supporting Red Crescent / Palm Swoop -->
      <path d="M -4 68 C 15 62 48 84 94 88 C 104 88 112 84 116 76 C 108 98 70 108 34 100 C 6 92 -4 74 -4 68 Z" fill="#8C1D24" />
    </g>

    <!-- Subtitle: Johannesburg Development Agency -->
    <text x="5" y="152" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="17" 
          font-weight="bold" 
          fill="#11293B" 
          letter-spacing="0.5">Johannesburg Development Agency</text>
  </g>
</svg>
