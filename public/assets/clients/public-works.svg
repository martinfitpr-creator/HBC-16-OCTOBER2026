<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <!-- South African National Coat of Arms Graphic -->
  <g transform="translate(15, 12) scale(0.85)">
    <!-- Sun Rays & Rising Sun -->
    <path d="M 50 22 L 56 10 L 62 22 L 72 14 L 74 27 L 86 24 L 84 36 L 96 40 L 90 50 L 100 58 L 90 64" fill="none" stroke="#E59B12" stroke-width="2.5" />
    <path d="M 68 34 A 18 18 0 0 1 82 48" fill="#E59B12" />

    <!-- Secretary Bird Wings & Crown -->
    <path d="M 75 30 C 60 15 30 25 15 55 C 32 46 55 48 70 54 C 85 48 108 46 125 55 C 110 25 80 15 75 30 Z" fill="#D99B26" stroke="#9A6B12" stroke-width="1.5" />

    <!-- Protea Flower Petals -->
    <path d="M 75 52 L 62 70 L 75 66 L 88 70 Z" fill="#2E7D32" />
    <polygon points="75,50 82,64 75,60 68,64" fill="#C62828" />

    <!-- Elephant Tusks flanking shield -->
    <path d="M 28 85 C 22 105 24 130 35 145 C 33 130 30 108 36 88 Z" fill="#E6AE3B" />
    <path d="M 122 85 C 128 105 126 130 115 145 C 117 130 120 108 114 88 Z" fill="#E6AE3B" />

    <!-- Wheat Ears / Grain -->
    <path d="M 22 145 C 20 120 18 95 14 75 M 128 145 C 130 120 132 95 136 75" stroke="#E6AE3B" stroke-width="2" fill="none" />

    <!-- Central Shield (Drum shape with Khoisan figures) -->
    <path d="M 45 74 Q 75 68 105 74 Q 108 120 75 142 Q 42 120 45 74 Z" fill="#F4E8D1" stroke="#9A6B12" stroke-width="2" />
    
    <!-- Shield Pattern: Ochre Figures -->
    <g fill="#A84318" transform="translate(56, 84) scale(0.65)">
      <!-- Left figure -->
      <circle cx="14" cy="10" r="4" />
      <path d="M 14 14 L 14 36 M 14 20 L 25 24 M 14 36 L 8 55 M 14 36 L 22 55" stroke="#A84318" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Right figure -->
      <circle cx="44" cy="10" r="4" />
      <path d="M 44 14 L 44 36 M 44 20 L 33 24 M 44 36 L 36 55 M 44 36 L 50 55" stroke="#A84318" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Clasping hands -->
      <path d="M 25 24 L 33 24" stroke="#A84318" stroke-width="3" />
    </g>

    <!-- Spear & Knobkierie crossing behind -->
    <line x1="32" y1="140" x2="118" y2="68" stroke="#5D4037" stroke-width="2.5" />
    <line x1="118" y1="140" x2="32" y2="68" stroke="#5D4037" stroke-width="2.5" />

    <!-- Base Banner with South African motto -->
    <path d="M 25 150 Q 75 162 125 150 L 122 160 Q 75 172 28 160 Z" fill="#2E7D32" />
    <text x="75" y="158" font-family="'Arial', sans-serif" font-size="5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!KE E: /XARRA //KE</text>
  </g>

  <!-- Right Side Text Lockup -->
  <g transform="translate(165, 30)">
    <!-- "public works" in bold orange lowercase -->
    <text x="0" y="44" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="46" 
          font-weight="bold" 
          fill="#F58220" 
          letter-spacing="-0.5">public works</text>

    <!-- Horizontal Black Divider Line -->
    <line x1="0" y1="62" x2="330" y2="62" stroke="#1A1A1A" stroke-width="2.5" />

    <!-- Department / Republic Text -->
    <text x="0" y="84" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="normal" 
          fill="#1A1A1A">Department:</text>
          
    <text x="0" y="104" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="bold" 
          fill="#1A1A1A">Public Works</text>

    <text x="0" y="125" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="14.5" 
          font-weight="900" 
          fill="#1A1A1A" 
          letter-spacing="0.5">REPUBLIC OF SOUTH AFRICA</text>
  </g>
</svg>
